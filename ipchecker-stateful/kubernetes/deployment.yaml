apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipchecker-stateful
  namespace: qpc40392445
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ipchecker-stateful
  template:
    metadata:
      labels:
        app: ipchecker-stateful
    spec:
      containers:
      - name: ipchecker-stateful
        image: repository.hal.davecutting.uk:5005/mattchris/ipchecker-stateful:latest
        ports:
        - containerPort: 3000
        env:
        - name: DOTNET_USE_POLLING_FILE_WATCHER
          value: "true"
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        imagePullPolicy: Always
      imagePullSecrets:
      - name: registry-credentials
