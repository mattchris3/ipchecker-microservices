# The single entry point. Serves the UI and forwards API traffic to services on
# the internal Docker network, so the browser only ever talks to one origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's internal DNS, re-resolved so a restarted service is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $proxy http://revproxy:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    location /monitor/ {
        set $monitor http://monitor:4000;
        rewrite ^/monitor/(.*)$ /$1 break;
        proxy_pass $monitor;
        proxy_read_timeout 15s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
